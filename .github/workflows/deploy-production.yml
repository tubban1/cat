name: Deploy cat.fde.fan

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cat-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]') || contains(github.event.head_commit.message, '[ops]')
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
        run: npm install --no-audit --no-fund

      - name: Build and type-check
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
        run: npm run build

      - name: Validate feedback database
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/init-feedback.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@latest --no-audit --no-fund

      - name: Link Vercel project
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          set -euo pipefail
          vercel link --yes --project cat --token="$VERCEL_API_TOKEN"
          test -f .vercel/project.json
          cat .vercel/project.json

      - name: Sync Supabase secret to Vercel production
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          PROJECT_ID="$(jq -r '.projectId' .vercel/project.json)"
          ORG_ID="$(jq -r '.orgId' .vercel/project.json)"
          jq -n --arg value "$SUPABASE_DB_URL" '{
            key: "SUPABASE_DB_URL",
            value: $value,
            type: "sensitive",
            target: ["production"],
            comment: "DON’T WAKE MISO feedback database"
          }' > /tmp/vercel-env.json

          HTTP_CODE="$(curl -sS -o /tmp/vercel-env-result.json -w '%{http_code}'             -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$ORG_ID&upsert=true"             -H "Authorization: Bearer $VERCEL_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/vercel-env.json)"

          jq 'del(.created.value, .value)' /tmp/vercel-env-result.json || true
          case "$HTTP_CODE" in
            200|201) ;;
            *) echo "Failed to sync Vercel production env (HTTP $HTTP_CODE)"; exit 1 ;;
          esac

      - name: Enable Vercel Web Analytics
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          set +e
          printf 'y\n' | script -qec "vercel project web-analytics enable cat --token=$VERCEL_API_TOKEN" /dev/null
          WEB_ANALYTICS_STATUS=$?
          echo "Web Analytics status: $WEB_ANALYTICS_STATUS"
          set -e

      - name: Deploy once to Vercel production
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
        id: deploy
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          set -euo pipefail
          vercel deploy --prod --yes --token="$VERCEL_API_TOKEN" 2>&1 | tee /tmp/vercel-deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "Could not discover deployment URL"
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $DEPLOY_URL"

      - name: Attach cat.fde.fan to Vercel project
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_ID="$(jq -r '.projectId' .vercel/project.json)"
          ORG_ID="$(jq -r '.orgId' .vercel/project.json)"
          HTTP_CODE="$(curl -sS -o /tmp/vercel-domain.json -w '%{http_code}' -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/domains?teamId=$ORG_ID" -H "Authorization: Bearer $VERCEL_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"cat.fde.fan"}')"
          cat /tmp/vercel-domain.json | jq . || cat /tmp/vercel-domain.json
          case "$HTTP_CODE" in
            200|201|409) ;;
            *) echo "Unexpected Vercel domain HTTP status: $HTTP_CODE"; exit 1 ;;
          esac

      - name: Configure Cloudflare DNS
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          ZONE_JSON="$(curl -fsS -G "$API/zones" -H "$AUTH" -H "Content-Type: application/json" --data-urlencode "name=fde.fan")"
          ZONE_ID="$(echo "$ZONE_JSON" | jq -r '.result[0].id // empty')"

          if [ -z "$ZONE_ID" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ZONE_JSON="$(curl -fsS -G "$API/zones" -H "$AUTH" -H "Content-Type: application/json" --data-urlencode "name=fde.fan" --data-urlencode "account.id=$CLOUDFLARE_ACCOUNT_ID")"
            ZONE_ID="$(echo "$ZONE_JSON" | jq -r '.result[0].id // empty')"
          fi

          if [ -z "$ZONE_ID" ]; then
            echo "Cloudflare zone fde.fan is not visible to CLOUDFLARE_API_TOKEN."
            echo "The token needs Zone:Read and DNS:Edit permission for fde.fan."
            echo "$ZONE_JSON" | jq .
            exit 1
          fi

          RECORD_JSON="$(curl -fsS -G "$API/zones/$ZONE_ID/dns_records" -H "$AUTH" -H "Content-Type: application/json" --data-urlencode "name=cat.fde.fan")"
          RECORD_ID="$(echo "$RECORD_JSON" | jq -r '.result[0].id // empty')"
          PAYLOAD='{"type":"CNAME","name":"cat","content":"a29b2037fb3c1fec.vercel-dns-017.com","ttl":60,"proxied":false,"comment":"DON’T WAKE MISO — managed by tubban1/cat"}'

          if [ -n "$RECORD_ID" ]; then
            RESULT="$(curl -fsS -X PUT "$API/zones/$ZONE_ID/dns_records/$RECORD_ID" -H "$AUTH" -H "Content-Type: application/json" --data "$PAYLOAD")"
          else
            RESULT="$(curl -fsS -X POST "$API/zones/$ZONE_ID/dns_records" -H "$AUTH" -H "Content-Type: application/json" --data "$PAYLOAD")"
          fi

          echo "$RESULT" | jq .
          test "$(echo "$RESULT" | jq -r '.success')" = "true"

      - name: Ask Vercel to verify custom domain
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          set +e
          vercel domains verify cat.fde.fan --token="$VERCEL_API_TOKEN"
          set -e

      - name: Verify public production health
        run: |
          set -euo pipefail
          READY=false
          for i in $(seq 1 18); do
            HTTP_CODE="$(curl -sSL --max-time 10 -o /tmp/health.json -w '%{http_code}' https://cat.fde.fan/api/health 2>/tmp/health.err || true)"
            if [ "$HTTP_CODE" = "200" ] && jq -e '.ok == true and .dbConfigured == true' /tmp/health.json >/dev/null 2>&1; then
              READY=true
              echo "Production health passed on attempt $i"
              cat /tmp/health.json
              break
            fi
            echo "attempt=$i http=$HTTP_CODE body=$(cat /tmp/health.json 2>/dev/null || true) err=$(cat /tmp/health.err 2>/dev/null || true)"
            sleep 10
          done
          if [ "$READY" != "true" ]; then
            echo "cat.fde.fan did not become healthy in time."
            exit 1
          fi

      - name: Diagnose production endpoints
        run: |
          set +e
          echo "=== Vercel production alias ==="
          curl -sS -D /tmp/alias-headers.txt --max-time 15 https://cat-blue-iota.vercel.app/api/health -o /tmp/alias-body.txt
          ALIAS_STATUS=$?
          cat /tmp/alias-headers.txt || true
          cat /tmp/alias-body.txt || true
          echo
          echo "alias curl status=$ALIAS_STATUS"

          echo "=== cat.fde.fan ==="
          curl -sS -D /tmp/custom-headers.txt --max-time 15 https://cat.fde.fan/api/health -o /tmp/custom-body.txt
          CUSTOM_STATUS=$?
          cat /tmp/custom-headers.txt || true
          cat /tmp/custom-body.txt || true
          echo
          echo "custom curl status=$CUSTOM_STATUS"
          set -e

      - name: Check custom domain propagation
        id: custom_domain
        run: |
          set +e
          READY=false
          for i in $(seq 1 18); do
            HTTP_CODE="$(curl -sSL --max-time 10 -o /tmp/custom-health.json -w '%{http_code}' https://cat.fde.fan/api/health 2>/tmp/custom-curl.err)"
            CURL_STATUS=$?
            if [ "$CURL_STATUS" -eq 0 ] && [ "$HTTP_CODE" = "200" ] && jq -e '.ok == true and .dbConfigured == true' /tmp/custom-health.json >/dev/null 2>&1; then
              READY=true
              echo "cat.fde.fan health ready on attempt $i"
              cat /tmp/custom-health.json
              break
            fi
            echo "attempt=$i curl=$CURL_STATUS http=$HTTP_CODE err=$(cat /tmp/custom-curl.err)"
            sleep 10
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "Custom domain ready: $READY"
          set -e

      - name: Release summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          CUSTOM_READY: ${{ steps.custom_domain.outputs.ready }}
        run: |
          {
            echo "## DON’T WAKE MISO production"
            echo ""
            if [ -n "$DEPLOY_URL" ]; then echo "- New Vercel deployment: $DEPLOY_URL"; else echo "- New Vercel deployment: skipped (ops-only run)"; fi
            echo "- Custom domain: https://cat.fde.fan"
            echo "- Custom domain responding now: $CUSTOM_READY"
            echo "- Vercel Web Analytics: enable command executed"
            echo "- Speed Insights: not auto-enabled because current Vercel CLI warns it may incur charges"
            echo "- Feedback DB: configured"
          } >> "$GITHUB_STEP_SUMMARY"
